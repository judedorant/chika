# Include in nginx's http context, e.g. /etc/nginx/conf.d/rchat.conf.
# Replace example hostnames and certificate paths after provisioning TLS.
map $http_upgrade $rchat_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name api.example.com ws.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/rchat/current/backend/public;
    index index.php;
    client_max_body_size 8m;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /storage/ { return 404; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/rchat-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
server {
    listen 443 ssl;
    server_name ws.example.com;
    ssl_certificate /etc/letsencrypt/live/ws.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ws.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=15552000" always;
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $rchat_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    # Keep Reverb's signed /apps HTTP publishing API internal.
    location / { return 404; }
}
