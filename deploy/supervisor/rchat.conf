[program:rchat-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/srv/rchat/current/backend
command=/usr/bin/php8.5 artisan queue:work redis --sleep=1 --tries=3 --timeout=90 --memory=256 --max-time=3600
user=rchat
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/rchat/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:rchat-reverb]
directory=/srv/rchat/current/backend
command=/usr/bin/php8.5 artisan reverb:start --host=127.0.0.1 --port=8080
user=rchat
autostart=true
autorestart=true
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/rchat/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
